name: verify

# This suite mostly watches upstream data, not this repo's code. OpenAI can add
# a country, rename one, or restructure its docs page at any time, and the first
# sign would be users being told their region is unsupported. The weekly run is
# the alarm for that.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'      # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          # bash 5 + GNU coreutils/gawk
          - os: ubuntu-latest
            label: linux
          # bash 3.2 + BSD coreutils + BWK awk — the combination macOS ships,
          # and the one that has already caught an awk -v portability bug.
          - os: macos-latest
            label: macos-bash3.2
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Show interpreter versions
        run: |
          /bin/bash --version | head -1
          awk --version 2>/dev/null | head -1 || echo "awk: BWK/BSD (no --version)"

      - name: Run verification suite
        env:
          NO_COLOR: '1'
        run: /bin/bash verify.sh

      - name: Run the checker itself
        env:
          NO_COLOR: '1'
        run: |
          /bin/bash openai.sh || rc=$?
          # 0 supported, 1 not supported, 2 undetermined. Runners are in
          # supported regions, so anything else is a real failure.
          [ "${rc:-0}" = "0" ] || { echo "unexpected exit ${rc}"; exit 1; }

  # Routers, NAS boxes and minimal containers run BusyBox awk, and it is stricter
  # than either awk the matrix above covers. A regex literal containing \/ works
  # on gawk and BWK awk and silently matches nothing here, which surfaced only as
  # "range data unavailable" on a user's OpenWrt router.
  busybox-awk:
    name: busybox awk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install BusyBox and shadow awk with it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          mkdir -p "$HOME/bbin"
          printf '#!/bin/sh\nexec busybox awk "$@"\n' > "$HOME/bbin/awk"
          chmod +x "$HOME/bbin/awk"
          PATH="$HOME/bbin:$PATH" awk 'BEGIN { print "awk in use:" }'
          busybox 2>&1 | head -1
      - name: Run verification suite under BusyBox awk
        env:
          NO_COLOR: '1'
        run: PATH="$HOME/bbin:$PATH" /bin/bash verify.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: shellcheck --severity=warning openai.sh verify.sh

  # The install one-liner in the README points at an unversioned jsdelivr URL,
  # which the CDN caches for up to 7 days. Without this, a push fixing a bug
  # does not reach anyone using that command until the cache happens to expire.
  purge-cdn:
    name: purge jsdelivr
    needs: [verify, busybox-awk, shellcheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # need the previous commit to diff against

      # jsdelivr throttles purges per file. Firing on every push — including
      # ones that only touch the workflow or the README — burns the quota, and
      # then the purge that actually matters is refused.
      - name: Decide whether a purge is warranted
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base commit — purging rather than risk a stale CDN"
            echo "purge=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'openai.sh'; then
            echo "openai.sh changed"
            echo "purge=true" >> "$GITHUB_OUTPUT"
          else
            echo "openai.sh unchanged — nothing users fetch has moved"
            echo "purge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge and confirm the CDN serves the new file
        if: steps.check.outputs.purge == 'true'
        run: |
          set -euo pipefail
          SLUG=${GITHUB_REPOSITORY}
          RESP=$(curl -sS --max-time 60 "https://purge.jsdelivr.net/gh/${SLUG}/openai.sh")
          echo "$RESP"
          if printf '%s' "$RESP" | grep -q '"throttled": *true'; then
            echo "::warning::jsdelivr throttled the purge; the CDN will catch up on its own TTL"
            exit 0
          fi
          for i in $(seq 1 8); do
            sleep 15
            curl -fsSL --max-time 30 "https://cdn.jsdelivr.net/gh/${SLUG}/openai.sh" -o cdn.sh
            curl -fsSL --max-time 30 "https://raw.githubusercontent.com/${SLUG}/main/openai.sh" -o raw.sh
            if cmp -s cdn.sh raw.sh; then
              echo "CDN is serving the current file (attempt $i)"
              exit 0
            fi
            echo "attempt $i: CDN still stale ($(wc -c < cdn.sh) vs $(wc -c < raw.sh) bytes)"
          done
          echo "::warning::jsdelivr still stale after purge; it will catch up on its own TTL"
